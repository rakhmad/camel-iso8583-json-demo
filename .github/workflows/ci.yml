name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  # ── Unit + integration tests ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Run unit and integration tests
        run: ./mvnw verify -Dcheckstyle.skip=true -Dspotbugs.skip=true

  # ── Static analysis + automated code review ───────────────────────────────
  analyze:
    name: Static Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write      # reviewdog posts PR review comments
      checks: write             # reviewdog posts check annotations
      security-events: write    # upload SpotBugs SARIF to Code Scanning

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Compile
        run: ./mvnw compile -q -Dcheckstyle.skip=true -Dspotbugs.skip=true

      # Checkstyle — posts inline review comments on PRs via reviewdog
      - name: Checkstyle (generate report)
        run: >
          ./mvnw checkstyle:checkstyle
          -Dcheckstyle.config.location=checkstyle.xml
          -Dcheckstyle.includeTestSourceDirectory=false
          -Dcheckstyle.outputFile=target/checkstyle-result.xml
        continue-on-error: true

      - name: Checkstyle (reviewdog PR annotations)
        uses: reviewdog/action-checkstyle@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          checkstyle_flags: -c checkstyle.xml src/main/java
          level: error
          filter_mode: added       # annotate only changed lines on PRs
          fail_on_error: true

      # SpotBugs — bytecode analysis; findings go to GitHub Code Scanning
      - name: SpotBugs (generate report)
        run: ./mvnw spotbugs:spotbugs -Dspotbugs.effort=Max -Dspotbugs.threshold=Medium
        continue-on-error: true

      - name: Upload SpotBugs SARIF to Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: target/spotbugs.sarif
          category: spotbugs

  # ── Package ───────────────────────────────────────────────────────────────
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build JVM package
        run: >
          ./mvnw package -DskipTests
          -Dcheckstyle.skip=true
          -Dspotbugs.skip=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: camel-iso-json-${{ github.sha }}
          path: target/camel-iso-json-*.jar
          if-no-files-found: error
          retention-days: 30
