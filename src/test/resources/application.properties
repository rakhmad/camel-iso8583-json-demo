camel.iso8583.switch.host=localhost
camel.iso8583.switch.port=19999
camel.iso8583.server.port=19583
camel.iso8583.netty.connect-timeout=1000
camel.iso8583.transaction.timeout-ms=30000
camel.iso8583.transaction.cleanup-interval-ms=60000
camel.iso8583.netty.retry-attempts=1
camel.iso8583.netty.retry-delay=100

# Exclude SeedDataRoute from Camel route discovery during tests.
# @IfBuildProfile("dev") vetoes the CDI bean but Camel's classpath scanner still
# instantiates the class (without injection), so delayMs=0 and the timer fires immediately.
# This build-time property tells the Camel Quarkus deployment processor to skip the class.
quarkus.camel.routes-discovery.exclude-patterns=id/redhat/razhari/route/SeedDataRoute
